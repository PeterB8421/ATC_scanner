{% extends 'base.html' %}

{% load static %}

{% block title %}
    Deleted recordings log
{% endblock %}

{% block breadcrumbs %}
    <nav aria-label="breadcrumb" class="container">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'index' %}">Homepage</a></li>
            <li class="breadcrumb-item" aria-current="page">Statistics</li>
        </ol>
    </nav>
{% endblock %}

{% block content %}
    <div class="container">
        <div id="errors"></div>
    </div>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Number of recordings & average SNR</h5>
                        <canvas id="timelineChart" height="100"></canvas>
                    </div>
                </div>
            </div>
    
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Deletion Breakdown</h5>
                        <canvas id="deletionsChart" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'mainApp/js/stats.js' %}"></script>
{% endblock %}
